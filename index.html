/* Layout : questionnaire en étapes, une rubrique par écran ; en-tête collant avec l'avancement, navigation fixée en bas, sommaire en panneau latéral */
:root{
  --bg:#FAFCFB; --surface:#FFFFFF; --tint:#F2F5F4; --ink:#20423C; --ink-2:#376B62; --muted:#6E7E79; --rule:#D8DEDB; --lav:#BBBFEE;
  --scrim:rgba(32,66,60,.38);
  --oui-bg:#20423C; --oui-fg:#FFFFFF;
  --plus-bg:#CFE3DC; --plus-fg:#20423C;
  --parler-bg:#BBBFEE; --parler-fg:#20423C;
  --non-bg:#E6EAE8; --non-fg:#5C6B66;
  --ok:#2F7A55; --warn:#9A5B12;
  --display:"Flared","Arial Narrow",Impact,sans-serif;
  --mono:"Space Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A17; --surface:#13221E; --tint:#172A25; --ink:#E2ECE8; --ink-2:#9CC4B9; --muted:#8C9D97; --rule:#2A3E38; --lav:#BBBFEE;
    --scrim:rgba(0,0,0,.55);
    --oui-bg:#A9D3C7; --oui-fg:#0E1A17;
    --plus-bg:#2C5249; --plus-fg:#E2ECE8;
    --parler-bg:#BBBFEE; --parler-fg:#1B1D3D;
    --non-bg:#26302D; --non-fg:#9AA8A3;
    --ok:#7CCBA2; --warn:#E3B06B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A17; --surface:#13221E; --tint:#172A25; --ink:#E2ECE8; --ink-2:#9CC4B9; --muted:#8C9D97; --rule:#2A3E38; --lav:#BBBFEE;
  --scrim:rgba(0,0,0,.55);
  --oui-bg:#A9D3C7; --oui-fg:#0E1A17;
  --plus-bg:#2C5249; --plus-fg:#E2ECE8;
  --parler-bg:#BBBFEE; --parler-fg:#1B1D3D;
  --non-bg:#26302D; --non-fg:#9AA8A3;
  --ok:#7CCBA2; --warn:#E3B06B;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.55;font-synthesis:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,.display{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;font-synthesis:none}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
h1:focus{outline:none}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:700}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding-block:10px 9px}
.top-club{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink)}
.top-step{font-size:12px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.top-count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:480px){.top-step{visibility:hidden}}
.track{height:4px;background:var(--rule)}
.track i{display:block;height:100%;width:0;background:var(--ink-2);transition:width .25s ease}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--oui-bg);background:var(--oui-bg);color:var(--oui-fg);padding:11px 18px;border-radius:3px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn[disabled]{opacity:.55;cursor:default;filter:none}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn-ghost:hover{border-color:var(--ink-2);filter:none}
.btn-small{padding:6px 10px;font-size:11px}
.link-btn{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--ink-2);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{color:var(--ink)}

/* Écran */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.stage{padding-block:32px 24px;display:grid;gap:20px;animation:in .18s ease}
@keyframes in{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.stage h1{font-size:clamp(32px,6.5vw,54px);line-height:.95;margin:0;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.stage .intro{color:var(--muted);font-size:13px;max-width:62ch}
.hello h1{font-size:clamp(40px,9vw,76px);border-bottom:0;padding-bottom:0}
.hello .lead{max-width:60ch}
.hello .sub{max-width:60ch;color:var(--muted);font-size:13px}
.hello-actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px}

.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--ink)}
.legend div{padding:12px 12px 12px 0;display:grid;gap:6px;align-content:start;min-width:0}
.legend span.tag{justify-self:start}
.legend p{font-size:12px;color:var(--muted)}
@media (max-width:640px){.legend{grid-template-columns:1fr 1fr}}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:2px;letter-spacing:.02em}
.tag.oui{background:var(--oui-bg);color:var(--oui-fg)} .tag.plus{background:var(--plus-bg);color:var(--plus-fg)}
.tag.parler{background:var(--parler-bg);color:var(--parler-fg)} .tag.non{background:var(--non-bg);color:var(--non-fg)}
.tag.vide{background:transparent;color:var(--muted);border:1px dashed var(--rule)}

.rub-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.rub-meta .rub-count{font-variant-numeric:tabular-nums}
.rows{border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 22px;align-items:center;padding-block:14px;border-bottom:1px solid var(--rule)}
.row-text{min-width:0}
.row-label{font-size:14px;font-weight:700;margin:0;line-height:1.35}
.row-hint{margin-top:3px;color:var(--muted);font-size:12.5px;max-width:56ch}
.row[data-state="non"] .row-label{color:var(--muted);font-weight:400}
.choices{display:grid;grid-template-columns:repeat(4,auto);gap:6px}
.ch{font-size:12px;padding:8px 10px;border:1px solid var(--rule);background:var(--surface);color:var(--muted);border-radius:3px;cursor:pointer;white-space:nowrap;line-height:1.2;transition:background-color .12s ease,color .12s ease,border-color .12s ease}
.ch:hover{border-color:var(--ink-2);color:var(--ink)}
.ch[aria-pressed="true"]{font-weight:700}
.ch[aria-pressed="true"][data-v="oui"]{background:var(--oui-bg);color:var(--oui-fg);border-color:var(--oui-bg)}
.ch[aria-pressed="true"][data-v="plus"]{background:var(--plus-bg);color:var(--plus-fg);border-color:var(--plus-bg)}
.ch[aria-pressed="true"][data-v="parler"]{background:var(--parler-bg);color:var(--parler-fg);border-color:var(--parler-bg)}
.ch[aria-pressed="true"][data-v="non"]{background:var(--non-bg);color:var(--non-fg);border-color:var(--non-bg)}
@media (max-width:760px){
  .row{grid-template-columns:1fr}
  .choices{grid-template-columns:1fr 1fr}
  .ch{white-space:normal;padding:10px}
}

/* Champs */
.field{display:grid;gap:6px;min-width:0}
.field label,.q-label{font-size:12.5px;font-weight:700;color:var(--ink)}
.q-sub{font-weight:400;color:var(--muted);font-size:12px}
input[type="text"],textarea{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:10px 12px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
input:focus,textarea:focus{border-color:var(--ink-2);outline:none;box-shadow:0 0 0 2px var(--rule)}
textarea{resize:vertical;min-height:72px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:8px 11px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer;line-height:1.25;text-align:left}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--oui-bg);color:var(--oui-fg);border-color:var(--oui-bg);font-weight:700}
.chip[aria-pressed="true"]::before{content:"✓ "}
.qs{display:grid;gap:18px;padding-top:6px}
.q{display:grid;gap:8px}
.legal{padding:12px 14px;background:var(--tint);border-radius:3px;font-size:12.5px;color:var(--ink)}

/* Récap */
.totals{display:flex;flex-wrap:wrap;gap:8px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:22px 28px}
@media (max-width:700px){.groups{grid-template-columns:1fr}}
.group{min-width:0}
.group-head{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.group-head .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.group ul{list-style:none;margin:0;padding:0}
.group li button{width:100%;display:flex;justify-content:space-between;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:7px 0;font-size:12.5px;cursor:pointer;color:var(--ink)}
.group li button:hover .g-label{text-decoration:underline;text-underline-offset:3px}
.group li .g-sec{color:var(--muted);font-size:11px;white-space:nowrap}
.group .empty{color:var(--muted);font-size:12px;padding:8px 0}
.send{display:grid;gap:12px;padding:20px;background:var(--tint);border-radius:3px}
.send .btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{font-size:13px;line-height:1.5}
.msg.ok{color:var(--ok);font-weight:700}
.msg.warn{color:var(--warn);font-weight:700}
.copy-zone{display:grid;gap:10px}
.copy-zone textarea{min-height:200px;font-size:12px}
.status{font-size:12px;color:var(--ink-2);min-height:1.5em}

/* Navigation du bas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px}
.nav .next-title{text-transform:none;letter-spacing:0;font-weight:400;max-width:22ch;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.nav .next-title{display:none}}

/* Sommaire */
.sheet{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;justify-content:flex-end}
.sheet-in{background:var(--bg);width:min(380px,100%);height:100%;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) 18px;display:grid;align-content:start;gap:12px;border-left:1px solid var(--rule)}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-size:28px;margin:0}
.steps{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.steps button{width:100%;display:flex;align-items:baseline;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 2px;cursor:pointer;color:var(--ink)}
.steps button[aria-current="step"]{font-weight:700}
.steps button[aria-current="step"] .s-name::after{content:"  ←";color:var(--ink-2)}
.steps .s-n{color:var(--muted);font-size:11px;width:2.2em;font-variant-numeric:tabular-nums}
.steps .s-name{flex:1;min-width:0}
.steps .s-c{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.steps .done .s-c{color:var(--ink-2);font-weight:700}

.foot{color:var(--muted);font-size:11.5px;padding-block:8px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

    {id:"qui",label:"Qui mettra le site à jour ?",opts:["Une seule personne","Plusieurs bénévoles","Le prestataire","Pas encore décidé"]},

    {id:"domaine",label:"Le club a-t-il un nom de domaine et des adresses mail à lui ?",opts:["Oui, à garder","Oui, à changer","Non","Je ne sais pas"]},
    {id:"outils",label:"Outils déjà utilisés par le club",multi:true,sub:"Plusieurs choix possibles",opts:["HelloAsso","Facebook","Instagram","Appli d’équipe (SportEasy ou autre)","Outil de lettre d’information","Google Drive","Autre"]}
  ];
  var TEXTS=[
    ["actuel","Ce qui ne va pas sur le site actuel","ex. impossible à mettre à jour, résultats jamais à jour…"],

  var STEPS=[{t:"accueil",titre:"Accueil"},{t:"vous",titre:"Qui répond"}]

    .concat([{t:"fin",titre:"Pour finir"},{t:"recap",titre:"Récap et envoi"}]);
  var LAST=STEPS.length-1;
  var ALL=[];SECTIONS.forEach(function(s,si){s.items.forEach(function(it){ALL.push({id:it[0],label:it[1],sec:s,step:si+2});});});
  var N=ALL.length;

  var KEY="cadrage-site-toec-toac-fct-v2";
  function rid(){return Math.random().toString(36).slice(2,8).toUpperCase();}
  function blank(){return {id:rid(),step:0,items:{},notes:{},obj:[],q:{},who:{nom:"",role:""},txt:{actuel:"",aime:"",date:"",oubli:""},sent:[],sendState:""};}
  var S=blank();
  try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);S=Object.assign(blank(),d);S.who=Object.assign(blank().who,d.who||{});S.txt=Object.assign(blank().txt,d.txt||{});}}catch(e){}
  if(S.sendState==="sending")S.sendState="";
  var resumeAt=S.step;S.step=0;
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  function answersKey(){return JSON.stringify([S.items,S.notes,S.obj,S.q,S.who,S.txt]);}

  function $(id){return document.getElementById(id);}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function pad(n){return (n<10?"0":"")+n;}
  function stateOf(id){return S.items[id]||"";}
  function labelOf(k){for(var i=0;i<STATES.length;i++){if(STATES[i].k===k)return STATES[i].label;}return "";}
  function counts(){var c={oui:0,plus:0,parler:0,non:0,done:0};ALL.forEach(function(a){var v=stateOf(a.id);if(v){c[v]++;c.done++;}});return c;}
  function secDone(s){var d=0;s.items.forEach(function(it){if(stateOf(it[0]))d++;});return d;}
  function qVal(q){var cur=S.q[q.id];if(Array.isArray(cur)&&cur.length)return cur.slice().sort(function(a,b){return a-b;}).map(function(k){return q.opts[k];}).join(", ");if(typeof cur==="number")return q.opts[cur];return "";}
  function objList(){return S.obj.slice().sort(function(a,b){return a-b;}).map(function(i){return OBJECTIFS[i];});}

  // Écrans
  function viewAccueil(){
    var resume=resumeAt>1&&resumeAt<=LAST;
    return '<div class="hello" style="display:grid;gap:18px">'+
      '<p class="eyebrow">TOEC TOAC FCT Rugby · nouveau site</p>'+
      '<h1 tabindex="-1">Ce que le site du club doit faire</h1>'+
      '<p class="lead">On a listé '+N+' choses qu’un site de club de rugby peut faire, de la page de l’école de rugby au score en direct. Pour chacune, vous dites si le club en a besoin. Il n’y a pas de bonne réponse : la liste sert à ne rien oublier avant de dessiner le site.</p>'+
      '<p class="sub">Une rubrique par écran, '+SECTIONS.length+' rubriques, une quinzaine de minutes. Vos réponses restent dans ce navigateur jusqu’à l’envoi : vous pouvez vous arrêter et revenir. Plusieurs personnes du club peuvent répondre, chacune de son côté. La boutique en ligne n’est pas dans la liste.</p>'+
      '<div class="legend" aria-label="Les quatre réponses possibles">'+STATES.map(function(st){return '<div><span class="tag '+st.k+'">'+st.label+'</span><p>'+st.def+'</p></div>';}).join("")+'</div>'+
      '<div class="hello-actions">'+(resume?'<button type="button" class="btn" data-go="'+resumeAt+'">Reprendre à l’étape '+resumeAt+'</button><button type="button" class="btn btn-ghost" data-go="1">Revoir depuis le début</button>':'<button type="button" class="btn" data-go="1">Commencer</button>')+'</div>'+
      '<p class="foot">Questionnaire préparé par Brique Lab pour le TOEC TOAC FCT Rugby, octobre 2026.</p>'+
    '</div>';
  }
  function viewVous(){
    return '<p class="eyebrow">Étape 1 sur '+LAST+'</p>'+
      '<h1 tabindex="-1">Qui répond ?</h1>'+
      '<div class="grid2">'+
        '<div class="field"><label for="who-nom">Votre nom</label><input type="text" id="who-nom" data-who="nom" autocomplete="name" placeholder="Prénom Nom"></div>'+
        '<div class="field"><label for="who-role">Votre rôle au club</label><input type="text" id="who-role" data-who="role" placeholder="ex. secrétaire, responsable école de rugby"></div>'+
      '</div>'+
      '<div class="field"><span class="q-label" id="obj-label">À quoi doit servir le nouveau site ? <span class="q-sub">Plusieurs choix possibles</span></span>'+
        '<div class="chips" role="group" aria-labelledby="obj-label">'+OBJECTIFS.map(function(o,i){return '<button type="button" class="chip" data-obj="'+i+'" aria-pressed="false">'+esc(o)+'</button>';}).join("")+'</div></div>';
  }
  function viewRub(step){
    var s=STEPS[step].sec,si=step-1;
    var rows=s.items.map(function(it){
      var btns=STATES.map(function(st){return '<button type="button" class="ch" data-item="'+it[0]+'" data-v="'+st.k+'" aria-pressed="false">'+st.label+'</button>';}).join("");
      return '<div class="row" data-row="'+it[0]+'"><div class="row-text"><h3 class="row-label" id="l-'+it[0]+'">'+esc(it[1])+'</h3><p class="row-hint">'+esc(it[2])+'</p></div><div class="choices" role="group" aria-labelledby="l-'+it[0]+'">'+btns+'</div></div>';
    }).join("");
    var qs="";
    if(s.questions){
      qs='<div class="qs">'+QUESTIONS.map(function(q){
        var chips=q.opts.map(function(o,k){return '<button type="button" class="chip" data-q="'+q.id+'" data-k="'+k+'" aria-pressed="false">'+esc(o)+'</button>';}).join("");
        return '<div class="q"><span class="q-label" id="q-'+q.id+'">'+esc(q.label)+(q.sub?' <span class="q-sub">'+esc(q.sub)+'</span>':'')+'</span><div class="chips" role="group" aria-labelledby="q-'+q.id+'">'+chips+'</div></div>';
      }).join("")+'</div>';
    }
    var legal=s.id==="pratique"?'<p class="legal"><b>Inclus d’office, sans rien cocher :</b> mentions légales, bandeau cookies, politique de données personnelles, site adapté au téléphone.</p>':'';
    return '<p class="eyebrow">Étape '+step+' sur '+LAST+' · rubrique '+pad(si)+' sur '+SECTIONS.length+'</p>'+
      '<h1 tabindex="-1">'+esc(s.titre)+'</h1>'+
      '<p class="intro">'+esc(s.intro)+'</p>'+
      '<div class="rub-meta"><span class="rub-count" id="rub-count"></span><button type="button" class="link-btn" id="fill" data-fill="'+s.id+'">Marquer le reste « Pas besoin »</button></div>'+
      '<div class="rows">'+rows+'</div>'+qs+legal+
      '<div class="field"><label for="note-'+s.id+'">Une autre idée pour cette rubrique ? <span class="q-sub">Facultatif</span></label><textarea id="note-'+s.id+'" data-note="'+s.id+'" rows="2"></textarea></div>';
  }
  function viewFin(){
    return '<p class="eyebrow">Étape '+(LAST-1)+' sur '+LAST+'</p>'+
      '<h1 tabindex="-1">Pour finir</h1>'+
      '<p class="intro">Tout est facultatif. Quelques lignes suffisent.</p>'+
      TEXTS.map(function(t){
        var input=t[0]==="date"?'<input type="text" id="txt-'+t[0]+'" data-txt="'+t[0]+'" placeholder="'+esc(t[2])+'">':'<textarea id="txt-'+t[0]+'" data-txt="'+t[0]+'" rows="3" placeholder="'+esc(t[2])+'"></textarea>';
        return '<div class="field"><label for="txt-'+t[0]+'">'+esc(t[1])+'</label>'+input+'</div>';
      }).join("");
  }
  function viewRecap(){
    var c=counts();
    var groups=STATES.concat([{k:"vide",label:"Sans réponse"}]).map(function(st){
      var list=ALL.filter(function(a){return st.k==="vide"?!stateOf(a.id):stateOf(a.id)===st.k;});
      if(st.k==="vide"&&!list.length)return "";
      var lis=list.length?'<ul>'+list.map(function(a){return '<li><button type="button" data-go="'+a.step+'"><span class="g-label">'+esc(a.label)+'</span><span class="g-sec">'+esc(a.sec.titre)+'</span></button></li>';}).join("")+'</ul>':'<p class="empty">Rien pour l’instant.</p>';
      return '<div class="group"><div class="group-head"><span class="tag '+st.k+'">'+st.label+'</span><span class="n">'+list.length+'</span></div>'+lis+'</div>';
    }).join("");
    var st=S.sendState,msg="";
    var last=S.sent[S.sent.length-1];var dt=last?new Date(last):null;
    var quand=dt?' le '+dt.toLocaleDateString("fr-FR")+' à '+dt.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):'';
    if(st==="ok"&&S.sentKey&&S.sentKey!==answersKey())st="changed";
    if(st==="ok"){
      msg='<p class="msg ok">C’est envoyé,'+quand+'. Merci.</p>'+
        '<p class="msg">Brique Lab reçoit vos réponses. Vous pouvez encore les modifier et renvoyer : un nouvel envoi s’ajoute au premier, rien ne s’efface.</p>';
    }else if(st==="changed"){
      msg='<p class="msg warn">Vous avez modifié des réponses depuis votre envoi du'+quand.replace(" le","")+'.</p><p class="msg">Renvoyez-les pour que Brique Lab ait la dernière version. Le premier envoi reste dans le tableau.</p>';
    }else if(st==="failed"){
      msg='<p class="msg warn">L’envoi n’est pas passé.</p><p class="msg">Copiez le récap ci-dessous et envoyez-le par mail à Hugo, de Brique Lab.</p>';
    }else{
      msg='<p class="msg">Vos réponses partent dans le tableau de Brique Lab. Vous pourrez encore les modifier après l’envoi.</p>';
    }
    var sending=st==="sending";
    var btnLabel=sending?"Envoi en cours…":(st==="ok"||st==="changed"?"Renvoyer mes réponses":"Envoyer mes réponses");
    return '<p class="eyebrow">Étape '+LAST+' sur '+LAST+'</p>'+
      '<h1 tabindex="-1">Récap et envoi</h1>'+
      '<p class="intro">Relisez vos choix. Un clic sur une ligne vous ramène à sa rubrique.</p>'+
      '<div class="totals">'+STATES.map(function(s2){return '<span class="tag '+s2.k+'">'+s2.label+' · '+c[s2.k]+'</span>';}).join("")+(N-c.done?'<span class="tag vide">Sans réponse · '+(N-c.done)+'</span>':'')+'</div>'+
      '<div class="groups">'+groups+'</div>'+
      '<div class="send">'+msg+
        '<div class="btns"><button type="button" class="btn" id="send"'+(sending?' disabled':'')+'>'+btnLabel+'</button>'+
        '<button type="button" class="btn btn-ghost" id="copy">Copier le récap</button><span class="status" id="status" aria-live="polite"></span></div>'+
      '</div>'+
      '<div class="copy-zone"'+(st==="failed"?'':' hidden')+' id="copy-zone"><label class="q-label" for="recap-text">Texte du récap</label><textarea id="recap-text" readonly></textarea></div>';
  }

  function render(focus){
    var i=S.step,st=STEPS[i],html;
    if(st.t==="accueil")html=viewAccueil();
    else if(st.t==="vous")html=viewVous();
    else if(st.t==="rub")html=viewRub(i);
    else if(st.t==="fin")html=viewFin();
    else html=viewRecap();
    var stage=$("stage");
    stage.innerHTML=html;
    stage.style.animation="none";void stage.offsetWidth;stage.style.animation="";
    // valeurs
    stage.querySelectorAll("[data-who]").forEach(function(el){el.value=S.who[el.dataset.who]||"";});
    stage.querySelectorAll("[data-txt]").forEach(function(el){el.value=S.txt[el.dataset.txt]||"";});
    stage.querySelectorAll("[data-note]").forEach(function(el){el.value=S.notes[el.dataset.note]||"";});
    var rt=$("recap-text");if(rt)rt.value=buildText();
    // navigation
    $("nav").hidden=(i===0);
    $("prev").hidden=(i===0);
    var nextBtn=$("next");
    if(i===LAST){nextBtn.hidden=true;}
    else{nextBtn.hidden=false;$("next-title").textContent=i+1===LAST?"":" : "+STEPS[i+1].titre;nextBtn.firstChild.nodeValue=(i+1===LAST?"Voir le récap":"Suivant");}
    $("top-step").textContent=i===0?"Accueil":"Étape "+i+" sur "+LAST+" · "+st.titre;
    $("track").style.width=(i/LAST*100)+"%";
    refresh();
    if(focus){
      window.scrollTo(0,0);
      var h=stage.querySelector("h1");if(h){try{h.focus({preventScroll:true});}catch(e){}}
    }
  }

  function refresh(){
    var stage=$("stage");
    stage.querySelectorAll(".row").forEach(function(r){
      var v=stateOf(r.dataset.row);r.dataset.state=v;
      r.querySelectorAll(".ch").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.v===v?"true":"false");});
    });
    stage.querySelectorAll("[data-obj]").forEach(function(b){b.setAttribute("aria-pressed",S.obj.indexOf(+b.dataset.obj)>-1?"true":"false");});
    stage.querySelectorAll("[data-q]").forEach(function(b){
      var cur=S.q[b.dataset.q],k=+b.dataset.k;
      b.setAttribute("aria-pressed",(Array.isArray(cur)?cur.indexOf(k)>-1:cur===k)?"true":"false");
    });
    var st=STEPS[S.step];
    if(st.t==="rub"){
      var d=secDone(st.sec),n=st.sec.items.length;
      $("rub-count").textContent=d+" / "+n+" répondues"+(d===n?" · complet":"");
      $("fill").hidden=(d===n);
    }
    var c=counts();
    $("top-count").textContent=c.done+" / "+N;
    $("top-count").title=c.done+" fonctionnalités répondues sur "+N;
  }

  function buildText(){
    var L=[];
    L.push("SITE DU TOEC TOAC FCT RUGBY : CADRAGE DES FONCTIONNALITÉS");
    var who=[S.who.nom,S.who.role].filter(Boolean).join(", ");
    L.push("Rempli par : "+(who||"(nom non renseigné)")+", le "+new Date().toLocaleDateString("fr-FR"));
    var c=counts();
    L.push("Réponses : "+c.done+" / "+N);
    L.push("");
    var o=objList();
    if(o.length){L.push("À QUOI DOIT SERVIR LE SITE");o.forEach(function(x){L.push("- "+x);});L.push("");}
    STATES.forEach(function(st){
      var list=ALL.filter(function(a){return stateOf(a.id)===st.k;});
      L.push(st.label.toUpperCase()+" ("+list.length+")");
      if(!list.length)L.push("- rien");
      list.forEach(function(a){L.push("- "+a.label+" ["+a.sec.titre+"]");});
      L.push("");
    });
    var none=ALL.filter(function(a){return !stateOf(a.id);});
    if(none.length){L.push("SANS RÉPONSE ("+none.length+")");none.forEach(function(a){L.push("- "+a.label+" ["+a.sec.titre+"]");});L.push("");}
    var ql=QUESTIONS.map(function(q){var v=qVal(q);return v?"- "+q.label+" "+v:"";}).filter(Boolean);
    if(ql.length){L.push("MISE À JOUR DU SITE");L=L.concat(ql);L.push("");}
    var notes=SECTIONS.filter(function(s){return (S.notes[s.id]||"").trim();});
    if(notes.length){L.push("IDÉES EN PLUS PAR RUBRIQUE");notes.forEach(function(s){L.push("- "+s.titre+" : "+S.notes[s.id].trim());});L.push("");}
    TEXTS.forEach(function(t){var v=(S.txt[t[0]]||"").trim();if(v){L.push(t[1].toUpperCase());L.push(v);L.push("");}});
    return L.join("\n").trim();
  }

  function payload(){
    var c=counts();
    var cols=[["Navigateur",S.id],["Envoi n°",S.sent.length+1],["Nom",S.who.nom.trim()],["Rôle",S.who.role.trim()],["Objectifs",objList().join(" ; ")],
      ["Indispensable (nb)",c.oui],["Bien d’avoir (nb)",c.plus],["À en parler (nb)",c.parler],["Pas besoin (nb)",c.non],["Sans réponse (nb)",N-c.done]];
    SECTIONS.forEach(function(s){s.items.forEach(function(it){cols.push([s.titre+" · "+it[1],labelOf(stateOf(it[0]))]);});});
    QUESTIONS.forEach(function(q){cols.push(["Mise à jour · "+q.label,qVal(q)]);});
    SECTIONS.forEach(function(s){cols.push([s.titre+" · autre idée",(S.notes[s.id]||"").trim()]);});
    TEXTS.forEach(function(t){cols.push([t[1],(S.txt[t[0]]||"").trim()]);});
    cols.push(["Récap complet",buildText()]);
    return {source:"cadrage-toec-toac-fct",colonnes:cols};
  }

  function send(){
    if(S.sendState==="sending")return;
    if(!SHEET_URL||SHEET_URL.indexOf("__")===0){S.sendState="failed";save();render(false);return;}
    S.sendState="sending";render(false);
    var body=JSON.stringify(payload());
    var p;
    try{p=fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body});}
    catch(e){p=Promise.reject(e);}
    p.then(function(){S.sent.push(new Date().toISOString());S.sentKey=answersKey();S.sendState="ok";save();render(false);},
           function(){S.sendState="failed";save();render(false);});
  }

  function copy(){
    var t=buildText();var zone=$("copy-zone"),ta=$("recap-text");
    ta.value=t;
    var fallback=function(){zone.hidden=false;ta.focus();ta.select();$("status").textContent="Copie bloquée par le navigateur : le texte est sélectionné, faites Cmd+C ou Ctrl+C.";};
    try{navigator.clipboard.writeText(t).then(function(){$("status").textContent="Récap copié.";},fallback);}catch(err){fallback();}
  }

  function go(i){
    i=Math.max(0,Math.min(LAST,i));
    if(i===LAST&&S.sendState==="failed")S.sendState="";
    S.step=i;save();closeToc();render(true);
  }

  // Sommaire
  function openToc(){
    $("toc-list").innerHTML=STEPS.slice(1).map(function(st,k){
      var i=k+1,info="",done=false;
      if(st.t==="rub"){var d=secDone(st.sec),n=st.sec.items.length;info=d+"/"+n;done=d===n;}
      return '<li><button type="button" data-go="'+i+'" class="'+(done?"done":"")+'"'+(i===S.step?' aria-current="step"':'')+'><span class="s-n">'+pad(i)+'</span><span class="s-name">'+esc(st.titre)+'</span><span class="s-c">'+info+'</span></button></li>';
    }).join("");
    $("toc").hidden=false;
    var cur=$("toc-list").querySelector('[aria-current="step"]')||$("close-toc");cur.focus();
  }
  function closeToc(){if(!$("toc").hidden){$("toc").hidden=true;$("open-toc").focus({preventScroll:true});}}

  document.addEventListener("click",function(e){
    if(e.target.id==="toc"){closeToc();return;}
    var b=e.target.closest("button");if(!b)return;
    if(b.dataset.item){var id=b.dataset.item,v=b.dataset.v;if(S.items[id]===v)delete S.items[id];else S.items[id]=v;save();refresh();return;}
    if(b.dataset.obj!==undefined){var oi=+b.dataset.obj,p=S.obj.indexOf(oi);if(p>-1)S.obj.splice(p,1);else S.obj.push(oi);save();refresh();return;}
    if(b.dataset.q){
      var q=QUESTIONS.filter(function(x){return x.id===b.dataset.q;})[0],k=+b.dataset.k;
      if(q.multi){var arr=Array.isArray(S.q[q.id])?S.q[q.id]:[];var j=arr.indexOf(k);if(j>-1)arr.splice(j,1);else arr.push(k);S.q[q.id]=arr;}
      else{if(S.q[q.id]===k)delete S.q[q.id];else S.q[q.id]=k;}
      save();refresh();return;
    }
    if(b.dataset.fill){var s=SECTIONS.filter(function(x){return x.id===b.dataset.fill;})[0];s.items.forEach(function(it){if(!S.items[it[0]])S.items[it[0]]="non";});save();refresh();return;}
    if(b.dataset.go!==undefined){go(+b.dataset.go);return;}
    if(b.id==="prev"){go(S.step-1);return;}
    if(b.id==="next"){go(S.step+1);return;}
    if(b.id==="open-toc"){openToc();return;}
    if(b.id==="close-toc"){closeToc();return;}
    if(b.id==="send"){send();return;}
    if(b.id==="copy"){copy();return;}
  });
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeToc();});

  var timer=null;
  document.addEventListener("input",function(e){
    var el=e.target;
    if(el.dataset.who)S.who[el.dataset.who]=el.value;
    else if(el.dataset.txt)S.txt[el.dataset.txt]=el.value;
    else if(el.dataset.note)S.notes[el.dataset.note]=el.value;
    else return;
    clearTimeout(timer);timer=setTimeout(save,250);
  });

  render(false);
})();
</script>

</body>
</html>
